name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # changesets/action đẩy nhánh changeset-release/main và mở Version PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Không lưu token vào .git/config: changesets/action tự cấu hình credential
      # từ GITHUB_TOKEN khi push, các bước khác không cần credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      # Job chỉ chạy `changeset version` (JS thuần): không cần prisma generate,
      # husky hay script cài đặt của dependency nào đang có quyền ghi repo.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Ứng dụng private: chỉ tạo Version PR, không npm publish.
      - name: Create Release PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
