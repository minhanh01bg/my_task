name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # changesets/action đẩy nhánh changeset-release/main và mở Version PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Giữ credential mặc định: job này push nhánh release.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ứng dụng private: chỉ tạo Version PR, không npm publish.
      - name: Create Release PR
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
