name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Quét secret trên các commit của push/PR. Repo cá nhân: không cần GITLEAKS_LICENSE.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Action đọc danh sách commit của PR qua API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ghim bản gitleaks thay vì mặc định cũ của action; Dependabot không tự nâng.
          GITLEAKS_VERSION: 8.30.1
          # Không comment lên PR để job không cần quyền ghi.
          GITLEAKS_ENABLE_COMMENTS: "false"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Script tests
        run: node --test scripts/backup-db.test.mjs scripts/db-reset-guard.test.mjs

      - name: Database backup tests
        run: python3 -m unittest discover -s tests/scripts -p "test_*.py"

      - name: Unit tests
        run: pnpm test

      - name: Prepare build database
        run: pnpm exec prisma db push --skip-generate
        env:
          DATABASE_URL: file:./ci.db

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: file:./ci.db
