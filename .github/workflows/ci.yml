name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.28.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Authenticated backup tests
        run: node --test scripts/backup-db.test.mjs

      - name: Database backup tests
        run: python3 -m unittest discover -s tests/scripts -p "test_*.py"

      - name: Unit tests
        run: pnpm test

      - name: Prepare build database
        run: pnpm exec prisma db push --skip-generate
        env:
          DATABASE_URL: file:./ci.db

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: file:./ci.db
