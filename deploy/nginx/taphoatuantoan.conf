# File nay duoc include tu sites-enabled BEN TRONG khoi http {} cua nginx.conf,
# nen cac dong *_zone duoi day nam o http context (hop le). Ten zone dung chung
# cho toan bo Nginx: giu tien to taphoatuantoan_ va khong include file hai lan.
limit_req_zone $binary_remote_addr zone=taphoatuantoan_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=taphoatuantoan_api:10m rate=20r/s;
# Chi tinh request ghi (POST Server Action, POST vao trang): GET/HEAD co key rong
# nen limit_req bo qua, duyet trang khong bi gioi han boi zone nay.
map $request_method $taphoatuantoan_write_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
}
limit_req_zone $taphoatuantoan_write_key zone=taphoatuantoan_write:10m rate=5r/s;
# Next image optimizer (sharp) ton CPU/RAM va ghi cache dia cho moi bien the moi.
limit_req_zone $binary_remote_addr zone=taphoatuantoan_image:10m rate=10r/s;
# Trang /shop la ISR: slug la cung duoc render va ghi cache 404 xuong dia.
limit_req_zone $binary_remote_addr zone=taphoatuantoan_shop:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=taphoatuantoan_conn:10m;

server {
    listen 80;
    server_name taphoatuantoan.disciplineqrhht.com;

    server_tokens off;

    # Anh san pham toi da 8 MB (src/app/api/products/images) + overhead multipart.
    client_max_body_size 10m;
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 30s;

    limit_conn taphoatuantoan_conn 100;
    limit_conn_status 429;
    limit_req_status 429;

    # Header proxy dat o muc server de moi location ke thua; location nao tu
    # khai bao proxy_set_header se mat toan bo danh sach nay.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Ghi de header do client gui, chi tin IP ket noi den Nginx (mot hop proxy;
    # app doc x-real-ip qua TRUSTED_CLIENT_IP_HEADER).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    # Xoa header noi bo cua Next.js do client gui (phong thu kieu CVE-2025-29927).
    # Giu x-middleware-prefetch: client Next gui hop le khi prefetch.
    proxy_set_header x-middleware-subrequest "";
    proxy_set_header x-middleware-invoke "";
    proxy_set_header x-middleware-next "";
    proxy_set_header x-middleware-rewrite "";
    proxy_set_header x-middleware-redirect "";
    proxy_set_header x-middleware-refresh "";
    proxy_set_header x-middleware-set-cookie "";
    proxy_set_header x-middleware-skip "";
    proxy_set_header x-middleware-override-headers "";
    proxy_set_header x-now-route-matches "";
    proxy_set_header x-matched-path "";
    proxy_buffering off;
    proxy_read_timeout 60s;

    # Chan dotfile (.env, .git, ...) nhung van cho /.well-known/ (ACME/Certbot).
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Dang nhap/dang ky/dang xuat admin va khach: gioi han chat theo IP.
    location /api/auth/ {
        limit_req zone=taphoatuantoan_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }

    location /api/customer-auth/ {
        limit_req zone=taphoatuantoan_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }

    location /api/ {
        limit_req zone=taphoatuantoan_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }

    # Mot trang danh sach tai vai chuc anh cung luc: burst lon, toc do duy tri vua phai.
    location /_next/image {
        limit_req zone=taphoatuantoan_image burst=80 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }

    # Link prefetch tai RSC cua moi san pham/danh muc dang hien: burst cho mot trang.
    location /shop {
        limit_req zone=taphoatuantoan_shop burst=100 nodelay;
        limit_req zone=taphoatuantoan_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        limit_req zone=taphoatuantoan_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
    }
}
